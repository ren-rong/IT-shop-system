<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>商品管理 - 电商后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; }
    .nav { display: flex; align-items: center; background: #001529; height: 56px; padding: 0 24px; color:#fff; }
    .nav .logo { font-size: 18px; font-weight: bold; margin-right: 40px; }
    .nav-links a { color: #c0c4cc; text-decoration: none; margin-right: 26px; font-size: 14px; }
    .nav-links a.active, .nav-links a:hover { color: #fff; }
    .nav .welcome { margin-left: auto; color: #c0c4cc; font-size: 13px; margin-right: 14px; }
    .btn-sm { background: #409eff; color:#fff; border:none; border-radius:4px; padding:6px 12px; cursor:pointer; }
    .container { padding: 24px; }
    .card { background:#fff; border-radius:8px; padding:22px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .card h3 { font-size:16px; color:#1f2d3d; margin-bottom:16px; }
    .form-row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    .form-row input { height:36px; padding:0 10px; border:1px solid #dcdfe6; border-radius:6px; font-size:14px; }
    .btn { background:#409eff; color:#fff; border:none; border-radius:6px; height:36px; padding:0 18px; cursor:pointer; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:11px 12px; border-bottom:1px solid #ebeef5; font-size:14px; }
    th { color:#909399; font-weight:normal; background:#fafafa; }
    .msg { font-size:13px; min-height:20px; margin-bottom:10px; }
    .msg.success { color:#67c23a; }
    .msg.error { color:#f56c6c; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="card">
      <h3>新增商品</h3>
      <div id="goods-msg" class="msg"></div>
      <div class="form-row">
        <input id="goods-name" type="text" placeholder="商品名称">
        <input id="goods-price" type="number" placeholder="价格" style="width:120px">
        <input id="goods-stock" type="number" placeholder="库存" style="width:120px">
        <button id="add-goods-btn" class="btn">新增商品</button>
      </div>
    </div>
    <div class="card">
      <h3>商品列表</h3>
      <table>
        <thead>
          <tr><th>ID</th><th>商品名称</th><th>价格(元)</th><th>库存</th></tr>
        </thead>
        <tbody id="goods-list"></tbody>
      </table>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    requireLogin();
    document.getElementById('nav').innerHTML = navBar('goods.html');
    const msgBox = document.getElementById('goods-msg');
    function showMsg(text, ok) {
      msgBox.textContent = text;
      msgBox.className = 'msg ' + (ok ? 'success' : 'error');
    }
    async function loadGoods() {
      const { body } = await apiFetch('/api/goods');
      const tbody = document.getElementById('goods-list');
      tbody.innerHTML = '';
      (body.data || []).forEach(g => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${g.id}</td><td class="goods-name">${g.name}</td><td>${g.price}</td><td>${g.stock}</td>`;
        tbody.appendChild(tr);
      });
    }
    document.getElementById('add-goods-btn').addEventListener('click', async () => {
      const name = document.getElementById('goods-name').value.trim();
      const price = parseFloat(document.getElementById('goods-price').value);
      const stock = parseInt(document.getElementById('goods-stock').value, 10);
      const { body } = await apiFetch('/api/goods/add', {
        method: 'POST',
        body: JSON.stringify({ name, price, stock })
      });
      if (body.code === 200) {
        showMsg('新增商品成功', true);
        document.getElementById('goods-name').value = '';
        document.getElementById('goods-price').value = '';
        document.getElementById('goods-stock').value = '';
        loadGoods();
      } else {
        showMsg(body.msg, false);
      }
    });
    loadGoods();
  </script>
</body>
</html>
