<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户管理 - 电商后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; }
    .nav { display: flex; align-items: center; background: #001529; height: 56px; padding: 0 24px; color:#fff; }
    .nav .logo { font-size: 18px; font-weight: bold; margin-right: 40px; }
    .nav-links a { color: #c0c4cc; text-decoration: none; margin-right: 26px; font-size: 14px; }
    .nav-links a.active, .nav-links a:hover { color: #fff; }
    .nav .welcome { margin-left: auto; color: #c0c4cc; font-size: 13px; margin-right: 14px; }
    .btn-sm { background: #409eff; color:#fff; border:none; border-radius:4px; padding:6px 12px; cursor:pointer; }
    .container { padding: 24px; }
    .card { background:#fff; border-radius:8px; padding:22px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .card h3 { font-size:16px; color:#1f2d3d; margin-bottom:16px; }
    .form-row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    .form-row input { height:36px; padding:0 10px; border:1px solid #dcdfe6; border-radius:6px; font-size:14px; }
    .btn { background:#409eff; color:#fff; border:none; border-radius:6px; height:36px; padding:0 18px; cursor:pointer; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:11px 12px; border-bottom:1px solid #ebeef5; font-size:14px; }
    th { color:#909399; font-weight:normal; background:#fafafa; }
    .msg { font-size:13px; min-height:20px; margin-bottom:10px; }
    .msg.success { color:#67c23a; }
    .msg.error { color:#f56c6c; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="card">
      <h3>新增用户</h3>
      <div id="user-msg" class="msg"></div>
      <div class="form-row">
        <input id="new-username" type="text" placeholder="用户名">
        <input id="new-password" type="password" placeholder="密码" style="width:140px">
        <input id="new-phone" type="text" placeholder="手机号" style="width:150px">
        <button id="add-user-btn" class="btn">新增用户</button>
      </div>
    </div>
    <div class="card">
      <h3>用户列表</h3>
      <table>
        <thead>
          <tr><th>ID</th><th>用户名</th><th>手机号</th><th>角色</th></tr>
        </thead>
        <tbody id="user-list"></tbody>
      </table>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    requireLogin();
    document.getElementById('nav').innerHTML = navBar('users.html');
    const msgBox = document.getElementById('user-msg');
    function showMsg(text, ok) {
      msgBox.textContent = text;
      msgBox.className = 'msg ' + (ok ? 'success' : 'error');
    }
    async function loadUsers() {
      const { body } = await apiFetch('/api/users');
      const tbody = document.getElementById('user-list');
      tbody.innerHTML = '';
      (body.data || []).forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${u.id}</td><td class="user-name">${u.username}</td><td>${u.phone||''}</td><td>${u.role}</td>`;
        tbody.appendChild(tr);
      });
    }
    document.getElementById('add-user-btn').addEventListener('click', async () => {
      const username = document.getElementById('new-username').value.trim();
      const password = document.getElementById('new-password').value;
      const phone = document.getElementById('new-phone').value.trim();
      const { body } = await apiFetch('/api/users/add', {
        method: 'POST',
        body: JSON.stringify({ username, password, phone })
      });
      if (body.code === 200) {
        showMsg('新增用户成功', true);
        document.getElementById('new-username').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('new-phone').value = '';
        loadUsers();
      } else {
        showMsg(body.msg, false);
      }
    });
    loadUsers();
  </script>
</body>
</html>
