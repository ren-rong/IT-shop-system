<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>订单管理 - 电商后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; }
    .nav { display: flex; align-items: center; background: #001529; height: 56px; padding: 0 24px; color:#fff; }
    .nav .logo { font-size: 18px; font-weight: bold; margin-right: 40px; }
    .nav-links a { color: #c0c4cc; text-decoration: none; margin-right: 26px; font-size: 14px; }
    .nav-links a.active, .nav-links a:hover { color: #fff; }
    .nav .welcome { margin-left: auto; color: #c0c4cc; font-size: 13px; margin-right: 14px; }
    .btn-sm { background: #409eff; color:#fff; border:none; border-radius:4px; padding:6px 12px; cursor:pointer; }
    .container { padding: 24px; }
    .card { background:#fff; border-radius:8px; padding:22px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .card h3 { font-size:16px; color:#1f2d3d; margin-bottom:16px; }
    .form-row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
    .form-row input { height:36px; padding:0 10px; border:1px solid #dcdfe6; border-radius:6px; font-size:14px; }
    .btn { background:#409eff; color:#fff; border:none; border-radius:6px; height:36px; padding:0 18px; cursor:pointer; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:11px 12px; border-bottom:1px solid #ebeef5; font-size:14px; }
    th { color:#909399; font-weight:normal; background:#fafafa; }
    .msg { font-size:13px; min-height:20px; margin-bottom:10px; }
    .msg.success { color:#67c23a; }
    .msg.error { color:#f56c6c; }
    .status-PAID { color:#67c23a; }
    .status-PENDING { color:#e6a23c; }
    .status-CANCELLED { color:#909399; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="card">
      <h3>创建订单</h3>
      <div id="order-msg" class="msg"></div>
      <div class="form-row">
        <input id="order-goods-id" type="number" placeholder="商品ID" style="width:120px">
        <input id="order-quantity" type="number" placeholder="购买数量" style="width:140px">
        <button id="create-order-btn" class="btn">提交订单</button>
      </div>
    </div>
    <div class="card">
      <h3>订单列表</h3>
      <table>
        <thead>
          <tr><th>订单号</th><th>商品</th><th>数量</th><th>金额(元)</th><th>状态</th><th>下单用户</th></tr>
        </thead>
        <tbody id="order-list"></tbody>
      </table>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    requireLogin();
    document.getElementById('nav').innerHTML = navBar('orders.html');
    const msgBox = document.getElementById('order-msg');
    function showMsg(text, ok) {
      msgBox.textContent = text;
      msgBox.className = 'msg ' + (ok ? 'success' : 'error');
    }
    async function loadOrders() {
      const { body } = await apiFetch('/api/orders');
      const tbody = document.getElementById('order-list');
      tbody.innerHTML = '';
      (body.data || []).forEach(o => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="order-no">${o.order_no}</td><td>${o.goods_name}</td>
          <td>${o.quantity}</td><td>${o.total_amount}</td>
          <td class="status-${o.status}">${o.status}</td><td>${o.username}</td>`;
        tbody.appendChild(tr);
      });
    }
    document.getElementById('create-order-btn').addEventListener('click', async () => {
      const goods_id = parseInt(document.getElementById('order-goods-id').value, 10);
      const quantity = parseInt(document.getElementById('order-quantity').value, 10);
      const { body } = await apiFetch('/api/orders/add', {
        method: 'POST',
        body: JSON.stringify({ goods_id, quantity })
      });
      if (body.code === 200) {
        showMsg('下单成功', true);
        document.getElementById('order-goods-id').value = '';
        document.getElementById('order-quantity').value = '';
        loadOrders();
      } else {
        showMsg(body.msg, false);
      }
    });
    loadOrders();
  </script>
</body>
</html>
